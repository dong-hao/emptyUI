[project]
name = "emptyui-example-plugin"
version = "0.1.0"
description = "Example emptyUI plugin — copy this package as a starting point for your own (see docs/plugin-guide.md)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy",
    # the framework itself; plugins never edit core, they register via entry points
    "emptyui",
]

[project.optional-dependencies]
dev = ["pytest", "ruff==0.16.4"]

[project.entry-points."emptyui.nodes"]
example = "emptyui_example.plugin:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emptyui_example"]

[tool.pytest.ini_options]
testpaths = ["tests"]
