<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9b59b6"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2980b9"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#186a3b"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#777"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1100" height="800" fill="#fafbfd"/>
  <text x="40" y="38" font-size="20" font-weight="bold" fill="#1a2733">emptyUI — a dataflow system for magnetotelluric processing</text>
  <text x="40" y="58" font-size="12" fill="#667">Structure on top (declarations), physics underneath (typed payloads); a graph edge is a real container of the mth5/aurora ecosystem.</text>

  <!-- ======== Browser ======== -->
  <rect x="40" y="78" width="1020" height="96" rx="10" fill="#eef3f8" stroke="#b9c8d6"/>
  <text x="60" y="100" font-size="13" font-weight="bold" fill="#2c5d8f">Browser — React + TypeScript (Vite, @xyflow/react, Zustand, TanStack Query)</text>
  <rect x="60" y="110" width="316" height="50" rx="7" fill="#ffffff" stroke="#9db6cc"/>
  <text x="218" y="132" font-size="12" text-anchor="middle" fill="#234">React Flow graph canvas</text>
  <text x="218" y="150" font-size="10" text-anchor="middle" fill="#667">workflow JSON ⇄ nodes &amp; edges</text>
  <rect x="392" y="110" width="316" height="50" rx="7" fill="#ffffff" stroke="#9db6cc"/>
  <text x="550" y="132" font-size="12" text-anchor="middle" fill="#234">Schema-driven panels</text>
  <text x="550" y="150" font-size="10" text-anchor="middle" fill="#667">inline params · properties · file browser</text>
  <rect x="724" y="110" width="316" height="50" rx="7" fill="#ffffff" stroke="#9db6cc"/>
  <text x="882" y="132" font-size="12" text-anchor="middle" fill="#234">Result viewers on nodes</text>
  <text x="882" y="150" font-size="10" text-anchor="middle" fill="#667">Preview Plot (resizable) · View Table · ⤓ download</text>

  <!-- connectors browser -> backend -->
  <path d="M 330 174 L 330 216" stroke="#777" stroke-width="1.6" fill="none" marker-end="url(#arrGray)"/>
  <text x="338" y="200" font-size="10" fill="#555">REST — GET /api/nodes · POST /api/runs · DELETE /api/cache · /api/files</text>
  <path d="M 770 216 L 770 174" stroke="#777" stroke-width="1.6" fill="none" marker-end="url(#arrGray)"/>
  <text x="778" y="200" font-size="10" fill="#555">WS — run events · progress · artifacts · payload summaries</text>

  <!-- ======== Backend ======== -->
  <rect x="40" y="220" width="1020" height="190" rx="10" fill="#f2f0f7" stroke="#c3b8d9"/>
  <text x="60" y="242" font-size="13" font-weight="bold" fill="#5b3f7e">FastAPI backend — the single source of truth (identity-blind; mounted behind a platform gateway)</text>
  <rect x="60" y="254" width="226" height="140" rx="7" fill="#ffffff" stroke="#a58fc4"/>
  <text x="173" y="276" font-size="12" font-weight="bold" text-anchor="middle" fill="#4a3a66">Node registry</text>
  <text x="173" y="296" font-size="10" text-anchor="middle" fill="#556">entry-point discovery</text>
  <text x="173" y="312" font-size="10" text-anchor="middle" fill="#556">manifest export (drives UI)</text>
  <text x="173" y="334" font-size="10" text-anchor="middle" fill="#667">plugin enable / disable</text>
  <text x="173" y="350" font-size="10" text-anchor="middle" fill="#667">hot reload — no respawn</text>
  <rect x="318" y="254" width="226" height="140" rx="7" fill="#ffffff" stroke="#a58fc4"/>
  <text x="431" y="276" font-size="12" font-weight="bold" text-anchor="middle" fill="#4a3a66">DAG executor</text>
  <text x="431" y="296" font-size="10" text-anchor="middle" fill="#556">Kahn topological scheduling</text>
  <text x="431" y="312" font-size="10" text-anchor="middle" fill="#556">targets &amp; ancestral closure</text>
  <text x="431" y="334" font-size="10" text-anchor="middle" fill="#667">cancellation between nodes</text>
  <text x="431" y="350" font-size="10" text-anchor="middle" fill="#667">failed-run hygiene</text>
  <rect x="576" y="254" width="226" height="140" rx="7" fill="#ffffff" stroke="#a58fc4"/>
  <text x="689" y="276" font-size="12" font-weight="bold" text-anchor="middle" fill="#4a3a66">Node cache</text>
  <text x="689" y="296" font-size="10" text-anchor="middle" fill="#556">structural signature = sha256(</text>
  <text x="689" y="312" font-size="10" text-anchor="middle" fill="#556">type · version · params · inputs)</text>
  <text x="689" y="334" font-size="10" text-anchor="middle" fill="#667">path params: stat signature</text>
  <text x="689" y="350" font-size="10" text-anchor="middle" fill="#667">artifacts copied on restore</text>
  <rect x="834" y="254" width="206" height="140" rx="7" fill="#ffffff" stroke="#a58fc4"/>
  <text x="937" y="276" font-size="12" font-weight="bold" text-anchor="middle" fill="#4a3a66">Data store + workspace</text>
  <text x="937" y="296" font-size="10" text-anchor="middle" fill="#556">typed handles (per run)</text>
  <text x="937" y="312" font-size="10" text-anchor="middle" fill="#556">workspace.mth5 persistence</text>
  <text x="937" y="334" font-size="10" text-anchor="middle" fill="#667">artifacts: plots / tables / files</text>
  <text x="937" y="350" font-size="10" text-anchor="middle" fill="#667">per-run temp dir + TTL/GC</text>
  <path d="M 286 324 L 318 324" stroke="#555" stroke-width="1.4" marker-end="url(#arr)" fill="none"/>
  <text x="302" y="316" font-size="9" text-anchor="middle" fill="#555">manifests</text>
  <path d="M 544 324 L 576 324" stroke="#555" stroke-width="1.4" marker-end="url(#arr)" fill="none"/>
  <path d="M 576 344 L 544 344" stroke="#555" stroke-width="1.4" marker-end="url(#arr)" fill="none"/>
  <text x="560" y="370" font-size="9" text-anchor="middle" fill="#555">keys ⇄ results</text>
  <path d="M 802 324 L 834 324" stroke="#555" stroke-width="1.4" marker-end="url(#arr)" fill="none"/>
  <text x="818" y="316" font-size="9" text-anchor="middle" fill="#555">handles</text>

  <!-- ======== Plugins ======== -->
  <rect x="40" y="430" width="1020" height="78" rx="10" fill="#f7f4ef" stroke="#d8cba8"/>
  <text x="60" y="450" font-size="13" font-weight="bold" fill="#7a6420">Plugins — pip-installable, entry-point registered; heavy deps live in plugin extras</text>
  <rect x="60" y="458" width="316" height="40" rx="7" fill="#ffffff" stroke="#cbb988"/>
  <text x="218" y="476" font-size="11" font-weight="bold" text-anchor="middle" fill="#234">emptyui-core-nodes</text>
  <text x="218" y="491" font-size="9" text-anchor="middle" fill="#667">numpy · matplotlib — LoadCSV, filters, previews, plots</text>
  <rect x="392" y="458" width="316" height="40" rx="7" fill="#ffffff" stroke="#cbb988"/>
  <text x="550" y="476" font-size="11" font-weight="bold" text-anchor="middle" fill="#234">emptyui-mth5</text>
  <text x="550" y="491" font-size="9" text-anchor="middle" fill="#667">mth5 · mt_metadata — MTH5/LEMI/MTU-5A, runs, TF I/O</text>
  <rect x="724" y="458" width="316" height="40" rx="7" fill="#ffffff" stroke="#cbb988"/>
  <text x="882" y="476" font-size="11" font-weight="bold" text-anchor="middle" fill="#234">emptyui-aurora</text>
  <text x="882" y="491" font-size="9" text-anchor="middle" fill="#667">aurora — Compute FC, Estimate TF, QC sorts</text>
  <path d="M 173 430 L 173 398" stroke="#9b59b6" stroke-width="1.6" marker-end="url(#arrPurple)" fill="none"/>
  <text x="181" y="418" font-size="9" fill="#9b59b6">register nodes</text>

  <!-- ======== Reference pipeline ======== -->
  <rect x="40" y="530" width="1020" height="230" rx="10" fill="#f4f7f4" stroke="#b9ccb9"/>
  <text x="60" y="552" font-size="13" font-weight="bold" fill="#2f5a2f">Reference MT pipeline — a node boundary ≈ an aurora pipeline stage; edge colours are port-type tags</text>

  <!-- main chain -->
  <rect x="64" y="580" width="150" height="46" rx="6" fill="#f3e9fa" stroke="#9b59b6"/>
  <text x="139" y="600" font-size="11" font-weight="bold" text-anchor="middle" fill="#234">Load MTH5 / LEMI / CSV</text>
  <text x="139" y="616" font-size="9" text-anchor="middle" fill="#667">survey · station · runs</text>
  <rect x="258" y="580" width="120" height="46" rx="6" fill="#eaf2f9" stroke="#2980b9"/>
  <text x="318" y="600" font-size="11" font-weight="bold" text-anchor="middle" fill="#234">Extract Run</text>
  <text x="318" y="616" font-size="9" text-anchor="middle" fill="#667">run id · time range</text>
  <rect x="422" y="580" width="120" height="46" rx="6" fill="#e7f2ea" stroke="#186a3b"/>
  <text x="482" y="600" font-size="11" font-weight="bold" text-anchor="middle" fill="#234">Compute FC</text>
  <text x="482" y="616" font-size="9" text-anchor="middle" fill="#667">taper · PW · calibrate</text>
  <rect x="586" y="580" width="120" height="46" rx="6" fill="#fbeceb" stroke="#c0392b"/>
  <text x="646" y="600" font-size="11" font-weight="bold" text-anchor="middle" fill="#234">Estimate TF</text>
  <text x="646" y="616" font-size="9" text-anchor="middle" fill="#667">OLS · robust · RME_RR</text>
  <rect x="766" y="566" width="120" height="40" rx="6" fill="#fdeef6" stroke="#d81b8c"/>
  <text x="826" y="590" font-size="10" font-weight="bold" text-anchor="middle" fill="#234">Export EDI / XML</text>
  <rect x="766" y="614" width="120" height="40" rx="6" fill="#fdeef6" stroke="#d81b8c"/>
  <text x="826" y="638" font-size="10" font-weight="bold" text-anchor="middle" fill="#234">Plot AppRes &amp; Phase</text>
  <rect x="930" y="590" width="110" height="40" rx="6" fill="#fdf4e3" stroke="#f39c12"/>
  <text x="985" y="614" font-size="10" font-weight="bold" text-anchor="middle" fill="#234">Preview / Save Plot</text>
  <path d="M 214 603 L 258 603" stroke="#9b59b6" stroke-width="1.6" marker-end="url(#arrPurple)" fill="none"/>
  <text x="236" y="596" font-size="9" text-anchor="middle" fill="#9b59b6">mth5</text>
  <path d="M 378 603 L 422 603" stroke="#2980b9" stroke-width="1.6" marker-end="url(#arrBlue)" fill="none"/>
  <text x="400" y="596" font-size="9" text-anchor="middle" fill="#2980b9">ts.run</text>
  <path d="M 542 603 L 586 603" stroke="#186a3b" stroke-width="1.6" marker-end="url(#arrGreen)" fill="none"/>
  <text x="564" y="596" font-size="9" text-anchor="middle" fill="#186a3b">fc</text>
  <path d="M 706 586 L 766 586" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrRed)" fill="none"/>
  <text x="736" y="579" font-size="9" text-anchor="middle" fill="#c0392b">tf</text>
  <path d="M 706 634 L 766 634" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrRed)" fill="none"/>
  <path d="M 886 634 L 930 614" stroke="#d81b8c" stroke-width="1.4" marker-end="url(#arr)" fill="none"/>
  <text x="908" y="630" font-size="9" text-anchor="middle" fill="#d81b8c">plot</text>

  <!-- remote reference -->
  <rect x="64" y="668" width="150" height="40" rx="6" fill="#f3e9fa" stroke="#9b59b6" stroke-dasharray="4 3"/>
  <text x="139" y="692" font-size="10" text-anchor="middle" fill="#234">Station B (remote)</text>
  <rect x="258" y="668" width="120" height="40" rx="6" fill="#eaf2f9" stroke="#2980b9" stroke-dasharray="4 3"/>
  <text x="318" y="692" font-size="10" text-anchor="middle" fill="#234">Extract Run</text>
  <rect x="422" y="668" width="120" height="40" rx="6" fill="#eef4f7" stroke="#5d8aa8" stroke-dasharray="4 3"/>
  <text x="482" y="692" font-size="10" text-anchor="middle" fill="#234">Align Runs</text>
  <text x="482" y="704" font-size="8" text-anchor="middle" fill="#8aa">common overlap · clock QC</text>
  <rect x="586" y="668" width="120" height="40" rx="6" fill="#e7f2ea" stroke="#186a3b" stroke-dasharray="4 3"/>
  <text x="646" y="692" font-size="10" text-anchor="middle" fill="#234">Compute FC (ref)</text>
  <path d="M 214 688 L 258 688" stroke="#9b59b6" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrPurple)" fill="none"/>
  <path d="M 378 688 L 422 688" stroke="#2980b9" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrBlue)" fill="none"/>
  <path d="M 542 688 L 586 688" stroke="#2980b9" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrBlue)" fill="none"/>
  <path d="M 646 668 L 646 626" stroke="#186a3b" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrGreen)" fill="none"/>
  <text x="654" y="652" font-size="9" fill="#186a3b">ref_fc</text>

  <!-- legend -->
  <text x="60" y="740" font-size="10" fill="#555">Port-type tags (backend-decided colours):</text>
  <circle cx="268" cy="736" r="5" fill="#9b59b6"/><text x="278" y="740" font-size="10" fill="#555">mth5</text>
  <circle cx="330" cy="736" r="5" fill="#2980b9"/><text x="340" y="740" font-size="10" fill="#555">ts.run / ts.runs</text>
  <circle cx="438" cy="736" r="5" fill="#186a3b"/><text x="448" y="740" font-size="10" fill="#555">fc</text>
  <circle cx="476" cy="736" r="5" fill="#c0392b"/><text x="486" y="740" font-size="10" fill="#555">tf</text>
  <circle cx="518" cy="736" r="5" fill="#d81b8c"/><text x="528" y="740" font-size="10" fill="#555">plot</text>
  <circle cx="570" cy="736" r="5" fill="#f39c12"/><text x="580" y="740" font-size="10" fill="#555">table</text>
  <text x="664" y="740" font-size="10" fill="#777" font-style="italic">solid = local chain · dashed = remote-reference path · a plugin node needs zero frontend changes</text>
</svg>
