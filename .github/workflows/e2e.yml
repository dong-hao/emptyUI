name: e2e

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Python backend (editable packages)
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
      - name: Create venv with MT plugin stack
        # --python pins the target: a stray VIRTUAL_ENV would otherwise
        # redirect the install away from ./​.venv (the backend is spawned
        # from the repo-root .venv in playwright.config.ts)
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e "packages/emptyui[dev]" -e "packages/emptyui-core-nodes[dev]" -e "packages/emptyui-mth5[dev]" -e "packages/emptyui-aurora[dev]" -e "examples/plugin-template[dev]"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/web/package-lock.json

      - name: Install frontend + Playwright browser
        working-directory: packages/web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run e2e tests (headless)
        working-directory: packages/web
        run: npm test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/web/playwright-report/
          retention-days: 7
