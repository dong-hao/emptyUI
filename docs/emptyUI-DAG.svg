<svg xmlns="http://www.w3.org/2000/svg" width="860" height="510" viewBox="0 0 860 510" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9b59b6"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2980b9"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#186a3b"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="860" height="510" fill="#fafbfd"/>

  <!-- ======== Reference pipeline ======== -->
  <rect x="20" y="20" width="820" height="470" rx="10" fill="#f4f7f4" stroke="#b9ccb9"/>
  <text x="40" y="46" font-size="13" font-weight="bold" fill="#2f5a2f">Reference MT pipeline — a node boundary ≈ an MT process stage; edge colours are port-type tags</text>

  <!-- main chain -->
  <text x="50" y="72" font-size="10" font-style="italic" fill="#777">local chain</text>
  <rect x="50" y="82" width="150" height="46" rx="6" fill="#f3e9fa" stroke="#9b59b6"/>
  <text x="125" y="102" font-size="11" font-weight="bold" text-anchor="middle" fill="#234">Load MTH5 / LEMI / CSV</text>
  <text x="125" y="118" font-size="9" text-anchor="middle" fill="#667">survey · station · runs</text>
  <rect x="240" y="82" width="150" height="46" rx="6" fill="#eaf2f9" stroke="#2980b9"/>
  <text x="315" y="102" font-size="11" font-weight="bold" text-anchor="middle" fill="#234">Extract Run</text>
  <text x="315" y="118" font-size="9" text-anchor="middle" fill="#667">run id · time range</text>
  <rect x="430" y="82" width="150" height="46" rx="6" fill="#e7f2ea" stroke="#186a3b"/>
  <text x="505" y="102" font-size="11" font-weight="bold" text-anchor="middle" fill="#234">Compute FC</text>
  <text x="505" y="118" font-size="9" text-anchor="middle" fill="#667">taper · PW · calibrate</text>
  <rect x="620" y="82" width="150" height="46" rx="6" fill="#fbeceb" stroke="#c0392b"/>
  <text x="695" y="102" font-size="11" font-weight="bold" text-anchor="middle" fill="#234">Estimate TF</text>
  <text x="695" y="118" font-size="9" text-anchor="middle" fill="#667">OLS · robust · RME_RR</text>

  <path d="M 200 105 L 240 105" stroke="#9b59b6" stroke-width="1.6" marker-end="url(#arrPurple)" fill="none"/>
  <text x="220" y="98" font-size="9" text-anchor="middle" fill="#9b59b6">mth5</text>
  <path d="M 390 105 L 430 105" stroke="#2980b9" stroke-width="1.6" marker-end="url(#arrBlue)" fill="none"/>
  <text x="410" y="98" font-size="9" text-anchor="middle" fill="#2980b9">ts.run</text>
  <path d="M 580 105 L 620 105" stroke="#186a3b" stroke-width="1.6" marker-end="url(#arrGreen)" fill="none"/>
  <text x="600" y="98" font-size="9" text-anchor="middle" fill="#186a3b">fc</text>

  <!-- remote reference -->
  <text x="50" y="180" font-size="10" font-style="italic" fill="#777">remote-reference path</text>
  <rect x="50" y="190" width="150" height="44" rx="6" fill="#f3e9fa" stroke="#9b59b6" stroke-dasharray="4 3"/>
  <text x="125" y="216" font-size="10" text-anchor="middle" fill="#234">Station B (remote)</text>
  <rect x="240" y="190" width="150" height="44" rx="6" fill="#eaf2f9" stroke="#2980b9" stroke-dasharray="4 3"/>
  <text x="315" y="216" font-size="10" text-anchor="middle" fill="#234">Extract Run</text>
  <rect x="430" y="190" width="150" height="44" rx="6" fill="#eef4f7" stroke="#5d8aa8" stroke-dasharray="4 3"/>
  <text x="505" y="208" font-size="10" text-anchor="middle" fill="#234">Align Runs</text>
  <text x="505" y="223" font-size="8" text-anchor="middle" fill="#8aa">common overlap · clock QC</text>
  <rect x="620" y="190" width="150" height="44" rx="6" fill="#e7f2ea" stroke="#186a3b" stroke-dasharray="4 3"/>
  <text x="695" y="216" font-size="10" text-anchor="middle" fill="#234">Compute FC (ref)</text>

  <path d="M 200 212 L 240 212" stroke="#9b59b6" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrPurple)" fill="none"/>
  <path d="M 390 212 L 430 212" stroke="#2980b9" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrBlue)" fill="none"/>
  <path d="M 580 212 L 620 212" stroke="#2980b9" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrBlue)" fill="none"/>
  <path d="M 695 190 L 695 128" stroke="#186a3b" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrGreen)" fill="none"/>
  <text x="703" y="164" font-size="9" fill="#186a3b">ref_fc</text>

  <!-- outputs -->
  <text x="620" y="290" font-size="10" font-style="italic" fill="#777">outputs</text>
  <rect x="620" y="300" width="150" height="40" rx="6" fill="#fdeef6" stroke="#d81b8c"/>
  <text x="695" y="324" font-size="10" font-weight="bold" text-anchor="middle" fill="#234">Export EDI / XML</text>
  <rect x="620" y="360" width="150" height="40" rx="6" fill="#fdeef6" stroke="#d81b8c"/>
  <text x="695" y="384" font-size="10" font-weight="bold" text-anchor="middle" fill="#234">Plot AppRes &amp; Phase</text>
  <rect x="430" y="360" width="150" height="40" rx="6" fill="#fdf4e3" stroke="#f39c12"/>
  <text x="505" y="384" font-size="10" font-weight="bold" text-anchor="middle" fill="#234">Preview / Save Plot</text>

  <path d="M 770 105 L 805 105 L 805 380 L 772 380" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrRed)" fill="none"/>
  <path d="M 805 320 L 772 320" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrRed)" fill="none"/>
  <circle cx="805" cy="320" r="3" fill="#c0392b"/>
  <text x="812" y="98" font-size="9" fill="#c0392b">tf</text>
  <path d="M 620 380 L 582 380" stroke="#d81b8c" stroke-width="1.4" marker-end="url(#arr)" fill="none"/>
  <text x="601" y="373" font-size="9" text-anchor="middle" fill="#d81b8c">plot</text>

  <!-- legend -->
  <text x="50" y="446" font-size="10" fill="#555">Port-type tags (backend-decided colours):</text>
  <circle cx="258" cy="442" r="5" fill="#9b59b6"/><text x="268" y="446" font-size="10" fill="#555">mth5</text>
  <circle cx="320" cy="442" r="5" fill="#2980b9"/><text x="330" y="446" font-size="10" fill="#555">ts.run / ts.runs</text>
  <circle cx="428" cy="442" r="5" fill="#186a3b"/><text x="438" y="446" font-size="10" fill="#555">fc</text>
  <circle cx="466" cy="442" r="5" fill="#c0392b"/><text x="476" y="446" font-size="10" fill="#555">tf</text>
  <circle cx="508" cy="442" r="5" fill="#d81b8c"/><text x="518" y="446" font-size="10" fill="#555">plot</text>
  <circle cx="560" cy="442" r="5" fill="#f39c12"/><text x="570" y="446" font-size="10" fill="#555">table</text>
  <text x="50" y="470" font-size="10" fill="#777" font-style="italic">solid = local chain · dashed = remote-reference path · a plugin node needs zero frontend changes</text>
</svg>
