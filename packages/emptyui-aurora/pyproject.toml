[project]
name = "emptyui-aurora"
version = "0.1.0"
description = "aurora-backed processing nodes for emptyui (ComputeFC, EstimateTF, config)"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "emptyui",
    "emptyui-mth5",
    "aurora==0.6.2",
    "mth5==0.6.8",
    "mt_metadata==1.0.10",
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "xarray>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.entry-points."emptyui.nodes"]
aurora = "emptyui_aurora.plugin:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emptyui_aurora"]
