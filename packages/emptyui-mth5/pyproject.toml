[project]
name = "emptyui-mth5"
version = "0.1.0"
description = "mth5-backed Data I/O and selection nodes for emptyui"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "emptyui",
    "mth5==0.6.8",
    "mt_metadata==1.0.10",
    "mt_timeseries==0.0.2",
    "numpy>=1.26",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.entry-points."emptyui.nodes"]
mth5 = "emptyui_mth5.plugin:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emptyui_mth5"]
