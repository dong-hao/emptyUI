[project]
name = "emptyui-core-nodes"
version = "0.1.0"
description = "Bundled minimal node plugin for emptyui"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["emptyui", "numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.entry-points."emptyui.nodes"]
core = "emptyui_core_nodes.plugin:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emptyui_core_nodes"]
